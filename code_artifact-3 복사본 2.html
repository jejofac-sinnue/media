<!-- 도구: ChatGPT & Gemini / 출처: 교재 Modularity, Pattern 장 확장 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>폐관 후의 수장고 · 만져도 되는 도감</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;600&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* --------------------------------------------------
   1. Design Tokens (:root에 색, 글자 크기, 간격, 모서리 값 정의)
-------------------------------------------------- */
:root {
  /* 반응형 12칼럼 그리드 토큰 */
  --cols: 12;
  --gutter: 24px;
  --margin: 16px;
  --max-width: 1200px;

  /* Color Tokens */
  --color-bg: #f1eadb;
  --color-ink: #1d1a16;
  --color-mut: rgba(29, 26, 22, 0.65);
  --color-surface-bg: rgba(255, 255, 255, 0.18);
  --color-border: rgba(29, 26, 22, 0.24);
  --color-accent: rgba(230, 0, 126, 0.12);

  /* 3 Primary Inks & Overprint Blend Mode */
  --ink-y: #ffe600;
  --ink-m: #e6007e;
  --ink-c: #0072e3;
  --ink-blend: multiply;

  /* Typography Tokens */
  --font-serif: 'Noto Serif KR', serif;
  --font-sans: 'Noto Sans KR', system-ui, sans-serif;
  --font-display: 'Cormorant Garamond', serif;

  --text-xs: 11px;
  --text-sm: 12.5px;
  --text-base: 14.5px;
  --text-lg: 18px;
  --text-xl: 36px;

  /* 여백 및 모서리 토큰 */
  --space-2xs: 4px;
  --space-xs: 8px;
  --space-sm: 12px;
  --space-md: 16px;
  --space-lg: 24px;

  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 20px;
  --radius-full: 50%;

  /* 무대(Stage) 기준 크기 및 중심 좌표 */
  --S: min(40vh, 32vw, 350px);
  --cy: 35%;

  /* 시간대별 역광·림라이트·그림자 토큰 */
  --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.05);
  --shadow-card-featured: 0 8px 30px rgba(0, 0, 0, 0.1);
  --sil: 0;
  --rim-solid: 255, 255, 255;
  --halo: none;
  --rim-x: 0px;
  --rim-y: -0.5px;
  --rim-c: rgba(255, 255, 255, 0.1);
  --rim-glow: 4px;
  --rim-glow-c: rgba(255, 255, 255, 0.15);
  --melt: 0px;

  box-sizing: border-box;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --color-bg: #15131a;
    --color-ink: #eee6d6;
    --color-mut: rgba(238, 230, 214, 0.68);
    --color-surface-bg: rgba(14, 12, 20, 0.42);
    --color-border: rgba(238, 230, 214, 0.24);
    --ink-blend: screen;
  }
}

*, *::before, *::after {
  box-sizing: inherit;
}

html, body {
  min-height: 100%;
  margin: 0;
  padding: 0;
  overflow-x: hidden;
  background: var(--color-bg);
  color: var(--color-ink);
  font-family: var(--font-sans);
}

body {
  min-height: 100vh;
  display: grid;
  grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
  gap: var(--gutter);
  padding: 0 var(--margin);
  max-width: var(--max-width);
  margin: 0 auto;
}

/* --------------------------------------------------
   2. Stage: 폐관 후의 수장고 & 바닥 끌림 궤적
-------------------------------------------------- */
#st {
  position: fixed;
  inset: 0;
  touch-action: none;
  cursor: grab;
  isolation: isolate;
  z-index: 2;
}
#st:active {
  cursor: grabbing;
}

#tracks {
  position: absolute;
  left: 50%;
  top: var(--cy);
  width: min(92vw, 960px);
  height: calc(var(--S) * 0.45);
  margin-left: calc(min(92vw, 960px) * -0.5);
  margin-top: calc(var(--S) * 0.14);
  mix-blend-mode: var(--ink-blend);
  pointer-events: none;
  overflow: visible;
  z-index: 1;
}

.layer {
  position: absolute;
  left: 50%;
  top: var(--cy);
  width: var(--S);
  height: var(--S);
  margin: calc(var(--S) * -0.725) 0 0 calc(var(--S) * -0.5);
  transform-origin: 50% 72.5%;
  will-change: transform, opacity, filter;
  mix-blend-mode: var(--ink-blend);
  color: var(--color-ink);
  pointer-events: none;
}

.layer svg {
  display: block;
  width: 100%;
  height: 100%;
  aspect-ratio: 1 / 1;
  object-fit: contain;
  overflow: visible;
}

/* 림 라이트 + 윤곽 번짐 + 깊이 블러 */
.layer > svg:not(.cast) {
  filter: drop-shadow(var(--rim-x) var(--rim-y) 0 var(--rim-c))
          drop-shadow(0 0 var(--rim-glow) var(--rim-glow-c))
          blur(calc(var(--melt) + var(--depth-blur, 0px)));
}

/* 의자 내부 레이어 간 3원색 오버프린트 혼색 */
.layer > svg:not(.cast) path,
.layer > svg:not(.cast) polygon,
.layer > svg:not(.cast) ellipse,
.layer > svg:not(.cast) rect,
.layer > svg:not(.cast) circle {
  mix-blend-mode: var(--ink-blend);
}

/* 의자 실루엣 투영 그림자 */
.layer svg.cast {
  position: absolute;
  inset: 0;
  overflow: visible;
  opacity: 0;
  transform-origin: 50% 93%;
  transform: skewX(var(--cast-skew, 0deg)) scaleY(var(--cast-sy, -0.3));
  filter: brightness(0) blur(var(--cast-blur, 2px));
  -webkit-mask-image: linear-gradient(to top, #000 8%, transparent 100%);
  mask-image: linear-gradient(to top, #000 8%, transparent 100%);
}

/* 3원색(Yellow / Magenta / Cyan-Blue) 잉크 조형 스타일 토큰 */
svg .iy { fill: var(--ink-y); fill-rule: evenodd; }
svg .im { fill: var(--ink-m); fill-rule: evenodd; }
svg .ic { fill: var(--ink-c); fill-rule: evenodd; }
svg .iy-soft { fill: var(--ink-y); opacity: 0.48; fill-rule: evenodd; }
svg .im-soft { fill: var(--ink-m); opacity: 0.42; fill-rule: evenodd; }
svg .ic-soft { fill: var(--ink-c); opacity: 0.38; fill-rule: evenodd; }
svg .hi { fill: var(--color-bg); opacity: 0.72; }
svg .b { fill: none; stroke: var(--color-bg); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
svg .sy { fill: none; stroke: var(--ink-y); stroke-linecap: round; stroke-linejoin: round; }
svg .sm { fill: none; stroke: var(--ink-m); stroke-linecap: round; stroke-linejoin: round; }
svg .sc { fill: none; stroke: var(--ink-c); stroke-linecap: round; stroke-linejoin: round; }
svg .sdy { fill: none; stroke: var(--ink-y); stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 3 4; opacity: 0.78; }
svg .sdm { fill: none; stroke: var(--ink-m); stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 3 4; opacity: 0.68; }
svg .sdc { fill: none; stroke: var(--ink-c); stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 3 4; opacity: 0.72; }

/* --------------------------------------------------
   3. Header & Controls
-------------------------------------------------- */
header {
  position: fixed;
  top: env(safe-area-inset-top, 0px);
  left: 0;
  right: 0;
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 20px var(--margin);
  display: grid;
  grid-template-columns: repeat(var(--cols), 1fr);
  gap: var(--gutter);
  pointer-events: none;
  z-index: 20;
}
header .title-wrap {
  grid-column: span 7;
}
header b {
  display: block;
  font: 700 20px var(--font-serif);
  letter-spacing: -0.01em;
}
header i {
  display: block;
  margin-top: 2px;
  font: italic 400 14px var(--font-display);
  color: var(--color-mut);
}
header .controls {
  grid-column: span 5;
  justify-self: end;
  display: flex;
  align-items: flex-start;
  gap: 8px;
}

button {
  font: 600 var(--text-xs) var(--font-sans);
  color: var(--color-ink);
  background: color-mix(in srgb, var(--color-bg) 72%, transparent);
  backdrop-filter: blur(6px);
  border: 1px solid var(--color-mut);
  border-radius: var(--radius-lg);
  padding: 6px 13px;
  cursor: pointer;
  pointer-events: auto;
  transition: background 0.2s, color 0.2s, transform 0.15s;
}
button:hover {
  background: var(--color-ink);
  color: var(--color-bg);
}

/* --------------------------------------------------
   4. Right Rail Navigation (연대기 점프 레일)
-------------------------------------------------- */
#rail {
  position: fixed;
  right: var(--margin);
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 4px;
  align-items: flex-end;
  z-index: 20;
}
#rail button {
  background: none;
  backdrop-filter: none;
  border: 0;
  padding: 2px 4px;
  display: flex;
  gap: 9px;
  align-items: center;
  font: 500 12px var(--font-display);
  color: var(--color-mut);
}
#rail button:hover {
  background: transparent;
  color: var(--color-ink);
}
#rail button:after {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: var(--radius-full);
  border: 1px solid var(--color-ink);
  transition: transform 0.2s, background 0.2s;
}
#rail button.on {
  color: var(--color-ink);
  font-weight: 700;
}
#rail button.on:after {
  background: var(--color-ink);
  transform: scale(1.25);
}

/* --------------------------------------------------
   5. Card Module: 만져도 되는 도감 (세밀 해부 묘사 포함)
-------------------------------------------------- */
#pn-container {
  position: fixed;
  left: 0;
  right: 0;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 0 var(--margin);
  display: grid;
  grid-template-columns: repeat(var(--cols), 1fr);
  gap: var(--gutter);
  pointer-events: none;
  z-index: 20;
}

.card-module {
  grid-column: span 8;
  width: 100%;
  min-width: 0;
  max-height: min(46vh, 420px);
  overflow: auto;
  overscroll-behavior: contain;
  transition: opacity 0.3s, transform 0.3s;
  pointer-events: auto;
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 7px 16px;
  background: color-mix(in srgb, rgba(10, 8, 16, 0.88) calc(var(--sil) * 100%), var(--color-surface-bg));
  color: color-mix(in srgb, rgb(var(--rim-solid)) calc(var(--sil) * 100%), var(--color-ink));
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  padding: var(--space-md) var(--space-lg);
  border-radius: var(--radius-md);
  border: 1px solid var(--color-border);
  border-left: 3px solid var(--color-ink);
  box-shadow: var(--shadow-card);
}

.card-module.o {
  opacity: 0;
  transform: translateY(10px);
}

.card-module > * {
  min-width: 0;
  overflow-wrap: anywhere;
}

.card-module .top-meta {
  grid-column: span 8;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}

.card-module .k {
  font: 600 var(--text-xs) var(--font-sans);
  letter-spacing: 0.16em;
  color: color-mix(in srgb, rgb(var(--rim-solid)) calc(var(--sil) * 75%), var(--color-mut));
  text-transform: uppercase;
}

.pattern-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  background: var(--color-ink);
  color: var(--color-bg);
  border-radius: var(--radius-sm);
  font: 600 var(--text-xs) var(--font-sans);
  letter-spacing: 0.02em;
}

.card-module .y {
  grid-column: span 3;
  font: 500 clamp(30px, 4.2vw, 52px)/1 var(--font-display);
  margin: 2px 0 4px;
  letter-spacing: -0.02em;
}

.card-module .title-block {
  grid-column: span 5;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.card-module h2 {
  font: 700 clamp(18px, 2vw, 22px)/1.25 var(--font-serif);
  margin: 0;
}

.card-module .en {
  font: italic 400 14px var(--font-display);
  color: color-mix(in srgb, rgb(var(--rim-solid)) calc(var(--sil) * 75%), var(--color-mut));
  margin-top: 2px;
}

.card-module .l {
  grid-column: span 8;
  font: 600 var(--text-base)/1.48 var(--font-serif);
  margin: 2px 0 0;
}

.card-module .b {
  grid-column: span 8;
  font: 400 var(--text-sm)/1.65 var(--font-sans);
  color: color-mix(in srgb, rgb(var(--rim-solid)) calc(var(--sil) * 78%), var(--color-mut));
  margin: 0;
}

/* 부위별 세밀 해부 도감 (등받이·좌판과 결속·다리와 접지) */
.card-module .anatomy {
  grid-column: span 8;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px;
  margin: 2px 0;
}
.card-module .anatomy .part {
  padding: 6px 9px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--color-border);
  background: color-mix(in srgb, var(--color-bg) 48%, transparent);
  font: 400 11.5px/1.48 var(--font-sans);
}
.card-module .anatomy .part strong {
  display: block;
  font: 700 10.5px var(--font-sans);
  letter-spacing: 0.04em;
  margin-bottom: 2px;
  opacity: 0.85;
}

.card-module .vs {
  grid-column: span 8;
  font: 400 12px/1.55 var(--font-sans);
  padding: 7px 10px;
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--color-ink) 7%, transparent);
  border-left: 2px solid var(--color-mut);
}

.card-module .m {
  grid-column: span 8;
  display: flex;
  flex-wrap: wrap;
  gap: 6px 14px;
  border-top: 1px solid var(--color-border);
  padding-top: var(--space-xs);
  font: 600 var(--text-xs) var(--font-sans);
  letter-spacing: 0.04em;
}

.card-module .m span::before {
  content: "# ";
  opacity: 0.55;
}

/* 17번째 현대 개개인의 의자: 실시간 자세 조율 바 */
.card-module .tuner-box {
  grid-column: span 8;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 16px;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  border: 1px dashed var(--color-border);
  background: color-mix(in srgb, var(--color-ink) 4%, transparent);
  font: 600 var(--text-xs) var(--font-sans);
}
.card-module .tuner-box label {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  cursor: pointer;
}
.card-module .tuner-box input[type="range"] {
  width: 84px;
  accent-color: var(--color-ink);
  cursor: pointer;
}
.card-module .tuner-box button {
  padding: 3px 9px;
  font-size: 11px;
  margin-left: auto;
}

header b, header i, .card-module .y, .card-module h2 {
  text-shadow: var(--halo);
}

#bloom, #shaft {
  position: fixed;
  inset: 0;
  pointer-events: none;
}
#bloom { z-index: 0; }
#shaft { z-index: 5; }

#hint {
  position: fixed;
  left: 50%;
  bottom: calc(8px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  font: 400 var(--text-xs) var(--font-sans);
  color: var(--color-mut);
  white-space: nowrap;
  transition: opacity 0.6s;
  pointer-events: none;
  z-index: 20;
}

#grid-overlay {
  position: fixed;
  inset: 0;
  margin: 0 auto;
  max-width: var(--max-width);
  padding: 0 var(--margin);
  display: grid;
  grid-template-columns: repeat(var(--cols), 1fr);
  gap: var(--gutter);
  pointer-events: none;
  z-index: 999;
  opacity: 0;
  transition: opacity 0.2s ease;
}
#grid-overlay.active { opacity: 1; }
#grid-overlay div {
  background: var(--color-accent);
  border-left: 1px solid rgba(230, 0, 126, 0.2);
  border-right: 1px solid rgba(230, 0, 126, 0.2);
  height: 100%;
}
#grid-btn {
  position: fixed;
  right: var(--margin);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  z-index: 1000;
}

/* --------------------------------------------------
   6. Responsive Breakpoints (1023px / 767px)
-------------------------------------------------- */
@media (max-width: 1023px) {
  :root {
    --cols: 8;
    --S: min(35vh, 38vw, 290px);
    --cy: 33%;
  }
  header .title-wrap { grid-column: span 5; }
  header .controls { grid-column: span 3; }
  .card-module {
    grid-column: span 8;
    max-height: min(46vh, 380px);
  }
}

@media (max-width: 767px) {
  :root {
    --cols: 4;
    --gutter: 14px;
    --margin: 16px;
    --S: min(30svh, 66vw, 250px);
    --cy: 50%;
  }

  html, body {
    height: auto;
    min-height: 100%;
    overflow-x: hidden;
    overflow-y: auto;
  }

  body {
    display: flex;
    flex-direction: column;
    gap: 0;
    min-height: 100svh;
    padding: 0 var(--margin);
  }

  header {
    position: relative;
    inset: auto;
    order: 1;
    width: 100%;
    padding: 14px 0 4px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  header b { font-size: 18px; }
  header i { font-size: 12.5px; }

  #st {
    position: relative;
    inset: auto;
    order: 2;
    width: 100%;
    height: clamp(240px, 35svh, 330px);
    min-height: 240px;
    overflow: visible;
  }

  .layer {
    top: 50%;
    margin: calc(var(--S) * -0.5) 0 0 calc(var(--S) * -0.5);
    transform-origin: 50% 50%;
  }

  #tracks {
    top: 50%;
    margin-top: calc(var(--S) * 0.34);
  }

  #pn-container {
    position: relative;
    inset: auto;
    order: 3;
    display: block;
    width: 100%;
    padding: 0 0 12px;
  }

  .card-module {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
    max-height: none;
    overflow: visible;
    padding: 16px;
  }

  .card-module .anatomy {
    grid-template-columns: 1fr;
  }

  #rail {
    position: relative;
    inset: auto;
    order: 4;
    transform: none;
    flex-direction: row;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    width: 100%;
    margin: 8px 0 16px;
  }
  #rail button {
    padding: 5px;
    min-width: 18px;
    justify-content: center;
  }
  #rail button span { display: none; }

  #hint {
    position: relative;
    left: auto;
    bottom: auto;
    order: 5;
    transform: none;
    width: 100%;
    max-width: 340px;
    margin: 0 auto 72px;
    white-space: normal;
    text-align: center;
    line-height: 1.6;
  }
}
</style>
</head>
<body>

<div id="grid-overlay">
  <div></div><div></div><div></div><div></div>
  <div></div><div></div><div></div><div></div>
  <div></div><div></div><div></div><div></div>
</div>
<button id="grid-btn">가이드</button>

<div id="st">
  <svg id="tracks" viewBox="-480 -30 960 120" aria-hidden="true"></svg>
</div>

<header>
  <div class="title-wrap">
    <b>폐관 후의 수장고 · 만져도 되는 도감</b>
    <i>After-Hours Vault — 17 Impossible Neighbors in One Room</i>
  </div>
  <div class="controls">
    <button id="light-btn" title="수장고 창밖 시각 전환">조명: 현재시각</button>
    <button id="snd">소리 켜짐</button>
  </div>
</header>

<nav id="rail"></nav>

<div id="pn-container">
  <section id="pn" class="card-module"></section>
</div>

<div id="hint">위아래 스크롤·드래그: 의자 사이 걸어들어가기 &nbsp;/&nbsp; 좌우로 밀기: 바닥에 끌며 자국 남기기</div>

<script>
/* --------------------------------------------------
   3원색(CMY) 오버프린트 SVG 패턴 및 드로잉 유틸리티 정의
-------------------------------------------------- */
document.body.insertAdjacentHTML('afterbegin', `
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- 금박·상형문자 3원색 세선 해칭 -->
    <pattern id="hv" width="6" height="6" patternUnits="userSpaceOnUse">
      <path stroke="#FFE600" stroke-width="1.3" d="M0 6L6 0M-1 1L1 -1M5 7L7 5"/>

/* --------------------------------------------------
   바닥 끌림 궤적 (Floor Scuff Trails — 3원색 오버프린트 자국)
-------------------------------------------------- */
let trackCooldown = 0;
function leaveFloorTrack(chairIdx, fromX, toX) {
  const now = performance.now();
  if (now - trackCooldown < 38) return;
  trackCooldown = now;

  const chair = D[chairIdx];
  if (!chair) return;

  const isHeavy = chair.mat === 'heavy-wood' || chair.mat === 'hardwood';
  const isSteel = chair.mat === 'tubular-steel';
  const isCaster = chair.mat === 'swivel-mesh';
  const strokeW = isHeavy ? 3.4 : isSteel ? 2.4 : isCaster ? 2.2 : 1.9;
  const baseOp = isHeavy ? 0.42 : 0.32;
  const primaryInks = ['#FFE600', '#E6007E', '#0072E3'];

  chair.feet.forEach((footOffset, k) => {
    const y = 32 + (k % 2 === 0 ? 12 : -4);
    const x1 = fromX + footOffset;
    const x2 = toX + footOffset;
    if (Math.abs(x2 - x1) < 2) return;

    const inkColor = primaryInks[(chairIdx + k) % 3];
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1.toFixed(1));
    line.setAttribute('y1', y);
    line.setAttribute('x2', x2.toFixed(1));
    line.setAttribute('y2', y);
    line.setAttribute('stroke', inkColor);
    line.setAttribute('stroke-width', strokeW);
    line.setAttribute('stroke-linecap', 'round');
    if (isSteel) line.setAttribute('stroke-dasharray', '10 3');
    else if (isCaster) line.setAttribute('stroke-dasharray', '16 2');
    line.style.opacity = baseOp;
    line.style.transition = 'opacity 11s ease-out';

    tracksSvg.appendChild(line);
    requestAnimationFrame(() => {
      line.style.opacity = '0';
    });
    setTimeout(() => line.remove(), 11200);
  });
}

/* --------------------------------------------------
   17번째 개개인의 의자 실시간 자세 조율 반영
-------------------------------------------------- */
function applyChairTune() {
  const personalLayer = L[N - 1];
  if (!personalLayer) return;
  personalLayer.querySelectorAll('.chair-upper').forEach(g => {
    g.style.transform = `translateY(${chairTune.lift}px)`;
  });
  personalLayer.querySelectorAll('.chair-back').forEach(g => {
    g.style.transform = `rotate(${chairTune.tilt}deg)`;
  });
}

      <p class="l">${d.l}</p>
      <p class="b">${d.b}</p>
      ${partsHtml}
      ${tunerHtml}
      <div class="vs"><strong>수장고의 시선 ·</strong> ${d.vs}</div>
      <div class="m">${d.m.map(x => `<span>${x}</span>`).join('')}</div>
    `;

    if (d.customizable) {
      const liftEl = document.getElementById('tune-lift');
      const tiltEl = document.getElementById('tune-tilt');
      const resetEl = document.getElementById('tune-reset');
      liftEl.oninput = e => {
        chairTune.lift = Number(e.target.value);
        applyChairTune();
      };
      tiltEl.oninput = e => {
        chairTune.tilt = Number(e.target.value);
        applyChairTune();
      };
      resetEl.onclick = () => {
        chairTune = { lift: 0, tilt: 0 };
        liftEl.value = 0;
        tiltEl.value = 0;
        applyChairTune();
        snd(i);
      };
    }

    pn.classList.remove('o');
  }, 220);

  [...rail.children].forEach((b, k) => b.classList.toggle('on', k === i));
}

/* --------------------------------------------------
   수장고 배경 팔레트 보간 (3원색 오버프린트가 선명히 살아나는 밝은 한지·아카이브 톤)
-------------------------------------------------- */
const PAL_DAY = [
  [244, 237, 222],
  [236, 241, 246],
  [246, 236, 240]
];
const PAL_NIGHT = [
  [22, 19, 28],
  [18, 22, 32],
  [26, 18, 28]
];

function col(zVal) {
  const i = Math.floor(zVal), t = zVal - i, u = t * t * (3 - 2 * t);
  const night = window.currentNightMix || 0;
  const aDay = PAL_DAY[i % 3], bDay = PAL_DAY[(i + 1) % 3];
  const aNgt = PAL_NIGHT[i % 3], bNgt = PAL_NIGHT[(i + 1) % 3];

  const bg = [0, 1, 2].map(k => {
    const dVal = aDay[k] + (bDay[k] - aDay[k]) * u;
    const nVal = aNgt[k] + (bNgt[k] - aNgt[k]) * u;
    return Math.round(dVal + (nVal - dVal) * night);
  });

  const ink = night > 0.5 ? '238,230,214' : '29,26,22';
  const r = document.documentElement.style;
  r.setProperty('--color-bg', `rgb(${bg[0]},${bg[1]},${bg[2]})`);
  r.setProperty('--color-ink', `rgb(${ink})`);
  r.setProperty('--color-mut', `rgba(${ink},0.68)`);
  r.setProperty('--ink-blend', night > 0.5 ? 'screen' : 'multiply');
}

/* --------------------------------------------------
   폐관 후의 수장고 무대 렌더링 (한 방에 함께 서 있는 원근 살롱)
-------------------------------------------------- */
function draw() {
  if (!busy) zd += (z - zd) * 0.14;

  const isMobile = innerWidth <= 767;
  const spreadFactor = isMobile ? 115 : 240;

  L.forEach((el, i) => {
    const d = zd - i;
    let s, o, tx, ty, depthBlur;

    if (d <= 0) {
      s = Math.pow(2.25, d);
      const side = Math.sin(i * 2.35);
      const dist = Math.min(1, Math.abs(d));
      tx = side * dist * spreadFactor;
      ty = d * (isMobile ? 16 : 26);
      depthBlur = Math.min(3.5, Math.abs(d) * 1.45);

      if (d < -3.2) o = 0;
      else if (d < -2.4) o = (d + 3.2) / 0.8 * 0.45;
      else o = Math.max(0.28, 1 + d * 0.28);
    } else {
      s = Math.pow(3.0, d);
      const side = Math.sin(i * 2.35) || 1;
      tx = side * d * (spreadFactor * 1.15);
      ty = d * 24;
      depthBlur = d * 2.2;
      o = d > 1.25 ? 0 : 1 - (d / 1.25);
    }

    const focusWeight = Math.max(0, 1 - Math.abs(d) * 1.6);
    const dragOffset = dx * (0.12 + 0.88 * focusWeight);

    el.style.opacity = o.toFixed(3);
    el.style.visibility = o > 0.01 ? 'visible' : 'hidden';
    el.style.zIndex = Math.round(50 - Math.abs(d) * 10);
    el.style.setProperty('--depth-blur', `${depthBlur.toFixed(2)}px`);
    el.style.transform = `translate3d(${(tx + dragOffset).toFixed(1)}px, ${ty.toFixed(1)}px, 0) scale(${s.toFixed(4)})`;
  });

  col(zd);

  const i = Math.round(zd);
  if (i !== cur && i >= 0 && i < N) {
    cur = i;
    info(i);
  }
  requestAnimationFrame(draw);
}

/* --------------------------------------------------
   의자 재질·무게별 바닥 끌림 마찰음 (Web Audio API)
-------------------------------------------------- */
function snd(idx = Math.round(z)) {
  if (mute) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();

    const chair = D[idx] || D[0];
    const mat = chair.mat;

    const profile = {
      'heavy-wood':     { f1: 190, f2: 340, q: 3.2, lfo: 18, thud1: 82,  thud2: 26, dur: 0.72 },
      'hardwood':       { f1: 260, f2: 490, q: 4.0, lfo: 22, thud1: 105, thud2: 34, dur: 0.65 },
      'lacquer-x':      { f1: 310, f2: 580, q: 4.5, lfo: 25, thud1: 118, thud2: 38, dur: 0.62 },
      'ivory-x':        { f1: 380, f2: 720, q: 5.0, lfo: 28, thud1: 135, thud2: 44, dur: 0.58 },
      'light-wood':     { f1: 340, f2: 660, q: 4.2, lfo: 26, thud1: 130, thud2: 42, dur: 0.58 },
      'bentwood':       { f1: 420, f2: 820, q: 4.8, lfo: 30, thud1: 150, thud2: 48, dur: 0.54 },
      'molded-plywood': { f1: 360, f2: 740, q: 4.4, lfo: 24, thud1: 128, thud2: 40, dur: 0.60 },
      'tubular-steel':  { f1: 880, f2: 1620, q: 7.5, lfo: 34, thud1: 210, thud2: 68, dur: 0.56 },
      'plastic':        { f1: 620, f2: 1120, q: 5.5, lfo: 20, thud1: 175, thud2: 56, dur: 0.52 },
      'polycarbonate':  { f1: 740, f2: 1340, q: 6.2, lfo: 22, thud1: 195, thud2: 64, dur: 0.50 },
      'swivel-mesh':    { f1: 520, f2: 960,  q: 5.8, lfo: 38, thud1: 165, thud2: 48, dur: 0.54 }
    }[mat] || { f1: 320, f2: 780, q: 4.2, lfo: 26, thud1: 110, thud2: 35, dur: 0.65 };

    const t = ac.currentTime;
    const dur = profile.dur;
    const sampleRate = ac.sampleRate;
    const bufferSize = Math.floor(sampleRate * dur);
    const buffer = ac.createBuffer(1, bufferSize, sampleRate);
    const data = buffer.getChannelData(0);

    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
    for (let i = 0; i < bufferSize; i++) {
      const white = Math.random() * 2 - 1;
      b0 = 0.99886 * b0 + white * 0.0555179;
      b1 = 0.99332 * b1 + white * 0.0750759;
      b2 = 0.96900 * b2 + white * 0.1538520;
      b3 = 0.86650 * b3 + white * 0.3104856;
      b4 = 0.55000 * b4 + white * 0.5329522;
      b5 = -0.7616 * b5 - white * 0.0168980;
      data[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.11;
      b6 = white * 0.115926;
    }

    const noise = ac.createBufferSource();
    noise.buffer = buffer;

    const filter = ac.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(profile.f1, t);
    filter.frequency.linearRampToValueAtTime(profile.f2, t + dur * 0.35);
    filter.frequency.linearRampToValueAtTime(profile.f1 * 1.15, t + dur);
    filter.Q.setValueAtTime(profile.q, t);

    const lfo = ac.createOscillator();
    lfo.type = 'sawtooth';
    lfo.frequency.setValueAtTime(profile.lfo, t);
    lfo.frequency.linearRampToValueAtTime(profile.lfo * 0.55, t + dur);

    const lfoGain = ac.createGain();
    lfoGain.gain.setValueAtTime(0.42, t);

    const mainGain = ac.createGain();
    mainGain.gain.setValueAtTime(0.01, t);
    mainGain.gain.linearRampToValueAtTime(0.68, t + 0.07);
    mainGain.gain.exponentialRampToValueAtTime(0.001, t + dur);

    noise.connect(filter);
    filter.connect(mainGain);
    lfo.connect(lfoGain);
    lfoGain.connect(mainGain.gain);
    mainGain.connect(ac.destination);

    noise.start(t);
    lfo.start(t);
    noise.stop(t + dur);
    lfo.stop(t + dur);

    const thud = ac.createOscillator();
    const thudGain = ac.createGain();
    thud.type = 'triangle';
    thud.frequency.setValueAtTime(profile.thud1, t + dur - 0.08);
    thud.frequency.exponentialRampToValueAtTime(profile.thud2, t + dur + 0.12);

    thudGain.gain.setValueAtTime(0, t + dur - 0.08);
    thudGain.gain.linearRampToValueAtTime(0.45, t + dur - 0.02);
    thudGain.gain.exponentialRampToValueAtTime(0.001, t + dur + 0.15);

    thud.connect(thudGain);
    thudGain.connect(ac.destination);
    thud.start(t + dur - 0.08);
    thud.stop(t + dur + 0.15);
  } catch (e) {}
}

/* --------------------------------------------------
   좌우 슬라이드 (의자 끌기 + 바닥 궤적 남기기)
-------------------------------------------------- */
function slide(dir) {
  hideHint();
  const currentIdx = Math.round(z);
  const nextIdx = currentIdx + dir;
  if (busy || nextIdx < 0 || nextIdx >= N) return;

  busy = 1;
  snd(currentIdx);
  const W = innerWidth, t0 = performance.now();
  let sw = 0, prevDx = dx;

  (function f(now) {
    const p = Math.min(1, (now - t0) / 860);
    if (p < 0.5) {
      dx = -dir * ez(p * 2) * W * 0.85;
      leaveFloorTrack(currentIdx, prevDx * 0.5, dx * 0.5);
    } else {
      if (!sw) {
        z = zd = nextIdx;
        sw = 1;
        prevDx = dir * W * 0.85;
      }
      dx = dir * (1 - ez((p - 0.5) * 2)) * W * 0.85;
      leaveFloorTrack(nextIdx, prevDx * 0.5, dx * 0.5);
    }
    prevDx = dx;

    if (p < 1) requestAnimationFrame(f);
    else {
      dx = 0;
      busy = 0;
    }
  })(t0);
}

function snap() {
  clearTimeout(tm);
  tm = setTimeout(() => {
    z = Math.round(z);
  }, 220);
}

addEventListener('wheel', e => {
  e.preventDefault();
  hideHint();
  if (busy) return;
  if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
    if (Math.abs(e.deltaX) > 28) slide(e.deltaX > 0 ? 1 : -1);
    return;
  }
  z = cl(z + e.deltaY * 0.0014);
  snap();
}, { passive: false });

let p0 = null, z0 = 0, ax = '', lastDragX = 0;
st.addEventListener('pointerdown', e => {
  p0 = [e.clientX, e.clientY];
  z0 = z;
  ax = '';
  lastDragX = 0;
  st.setPointerCapture(e.pointerId);
});

st.addEventListener('pointermove', e => {
  if (!p0 || busy) return;
  const x = e.clientX - p0[0], y = e.clientY - p0[1];
  if (!ax && Math.hypot(x, y) > 10) ax = Math.abs(x) > Math.abs(y) ? 'h' : 'v';

  if (ax === 'v') {
    hideHint();
    z = cl(z0 - y / (innerHeight * 0.45));
  } else if (ax === 'h') {
    hideHint();
    dx = x * 0.45;
    leaveFloorTrack(Math.round(z), lastDragX, dx);
    lastDragX = dx;
  }
});

st.addEventListener('pointerup', e => {
  if (!p0) return;
  const x = e.clientX - p0[0];
  if (ax === 'h') {
    if (Math.abs(x) > 55) {
      slide(x < 0 ? 1 : -1);
    } else {
      dx = 0;
    }
  } else if (ax === 'v') {
    snap();
  }
  p0 = null;
});

st.addEventListener('pointercancel', () => {
  p0 = null;
  if (!busy) dx = 0;
});

addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'ArrowRight') slide(1);
  else if (k === 'ArrowLeft') slide(-1);
  else if (k === 'ArrowDown' || k === '+') { hideHint(); z = cl(Math.round(z) + 1); }
  else if (k === 'ArrowUp' || k === '-') { hideHint(); z = cl(Math.round(z) - 1); }
});

document.getElementById('snd').onclick = function () {
  mute = !mute;
  this.textContent = mute ? '소리 꺼짐' : '소리 켜짐';
};

const gridOverlay = document.getElementById('grid-overlay');
document.getElementById('grid-btn').onclick = function () {
  gridOverlay.classList.toggle('active');
};

/* --------------------------------------------------
   시간대별 수장고 역광 (Time-of-day Backlight + 조명 프리셋 순환)
-------------------------------------------------- */
(() => {
  document.body.insertAdjacentHTML('afterbegin', '<div id="bloom"></div>');
  document.body.insertAdjacentHTML('beforeend', '<div id="shaft"></div>');
  const bloom = document.getElementById('bloom');
  const shaft = document.getElementById('shaft');
  const root = document.documentElement.style;
  const lerp = (a, b, t) => a + (b - a) * t;
  const sm = (a, b, x) => {
    const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
    return t * t * (3 - 2 * t);
  };

  const LIGHT = [
    [0, 120, 150, 255], [5, 140, 170, 255], [6, 255, 190, 140], [7.5, 255, 222, 170],
    [10, 255, 246, 228], [13, 255, 255, 255], [16, 255, 226, 160], [17.5, 255, 170, 90],
    [18.5, 255, 120, 90], [19.5, 200, 110, 200], [21, 120, 150, 255], [24, 120, 150, 255]
  ];

  function light(h) {
    for (let i = 0; i < LIGHT.length - 1; i++) {
      const a = LIGHT[i], b = LIGHT[i + 1];
      if (h >= a[0] && h <= b[0]) {
        const t = (h - a[0]) / (b[0] - a[0]);
        return [1, 2, 3].map(k => Math.round(lerp(a[k], b[k], t))).join(',');
      }
    }
    return '255,255,255';
  }

  const PRESETS = [
    { label: '조명: 현재시각', h: null },
    { label: '조명: 새벽 창빛', h: 6.3 },
    { label: '조명: 정오 채광', h: 12.5 },
    { label: '조명: 해질녘 역광', h: 17.6 },
    { label: '조명: 심야 달빛', h: 22.5 }
  ];
  let presetIdx = 0;

  function hourNow() {
    if (PRESETS[presetIdx].h !== null) return PRESETS[presetIdx].h;
    const m = location.hash.match(/[#&]h=(\d+(?:\.\d+)?)/);
    if (m) return Math.min(24, +m[1]);
    const d = new Date();
    return d.getHours() + d.getMinutes() / 60;
  }

  let castOp = 0.4;

  function applyLight() {
    const h = hourNow();
    const t = (h - 6) / 12;
    const k = Math.max(0, Math.sin(Math.PI * t));
    const w = sm(0, 0.3, k);
    const wb = sm(0, 0.06, k);
    const X = lerp(0.6, -Math.cos(Math.PI * t), w);
    const sun = -X;
    const len = lerp(2.4, Math.min(4.5, 1 / Math.max(k, 0.22)), w);
    const back = lerp(0.3, Math.pow(1 - k, 1.6), wb);
    const sil = sm(0.62, 0.95, back) * wb;
    const beam = sm(0.45, 0.9, back) * sm(0, 0.08, k);
    const L = light(h);
    const rgba = a => `rgba(${L},${a.toFixed(3)})`;

    window.currentNightMix = 1 - w;
    root.setProperty('--sil', sil.toFixed(3));
    root.setProperty('--rim-solid', L);
    root.setProperty('--rim-x', `${(sun * (1.2 + 2.6 * back)).toFixed(2)}px`);
    root.setProperty('--rim-y', `${(-0.4 - 1.4 * back).toFixed(2)}px`);
    root.setProperty('--rim-c', rgba(0.08 + 0.84 * back));
    root.setProperty('--rim-glow', `${(3 + 14 * back).toFixed(1)}px`);
    root.setProperty('--rim-glow-c', rgba(0.12 + 0.5 * back));
    root.setProperty('--melt', `${(0.8 * sm(0.5, 0.95, back) * wb).toFixed(2)}px`);

    const a = back * 0.9;
    root.setProperty('--halo', `0 0 2px ${rgba(a)}, 0 0 10px ${rgba(a * 0.75)}, 0 0 26px ${rgba(a * 0.55)}`);

    const card = e => {
      const rx = (-sun * (1.5 + 2 * back)).toFixed(2);
      const ry = (1 + 1.5 * back).toFixed(2);
      return `inset ${rx}px ${ry}px 0 0 ${rgba(0.1 + 0.75 * back)}, ` +
             `inset 0 0 ${(10 + 12 * sil).toFixed(0)}px ${rgba(0.05 + 0.3 * sil)}, ` +
             `0 0 ${(e * (1 + 3 * back)).toFixed(0)}px ${rgba(0.06 + 0.5 * back * (0.6 + 0.4 * sil))}`;
    };
    root.setProperty('--shadow-card', card(5));

    const sx = 50 + sun * 40, sy = 78 - k * 58;
    const r = 34 + 42 * (1 - k) * wb + 10 * (1 - wb);
    const ba = lerp(0.12, 0.12 + 0.36 * back, wb);
    bloom.style.background = `radial-gradient(circle at ${sx.toFixed(1)}% ${sy.toFixed(1)}%, ` +
      `${rgba(ba)} 0%, ${rgba(ba * 0.55)} ${(r * 0.35).toFixed(0)}vmax, ${rgba(0)} ${r.toFixed(0)}vmax)`;

    const ang = 90 + 40 * sun, pos = 50 + sun * 14;
    shaft.style.background = `linear-gradient(${ang.toFixed(0)}deg, ${rgba(0)} ${pos - 24}%, ` +
      `${rgba(0.45 * beam)} ${pos - 5}%, ${rgba(0.75 * beam)} ${pos}%, ${rgba(0.3 * beam)} ${pos + 6}%, ` +
      `${rgba(0)} ${pos + 14}%, ${rgba(0.18 * beam)} ${pos + 24}%, ${rgba(0)} ${pos + 30}%)`;
    const mk = 'linear-gradient(to bottom, #000 0%, rgba(0,0,0,.25) 70%, transparent 100%)';
    shaft.style.webkitMaskImage = mk;
    shaft.style.maskImage = mk;

    const lean = Math.max(-55, Math.min(55, Math.atan(X * (len - 0.5) * 0.3) * 180 / Math.PI));
    const blur = lerp(8, 1 + (1 - k) * 6, w);
    root.setProperty('--cast-skew', `${lean.toFixed(1)}deg`);
    root.setProperty('--cast-sy', (-(0.16 + (len - 1) * 0.15)).toFixed(3));
    root.setProperty('--cast-blur', `${(blur * 0.7).toFixed(1)}px`);
    castOp = lerp(0.14, 0.34 + 0.16 * Math.sqrt(k), w);
  }

  document.getElementById('light-btn').onclick = function () {
    presetIdx = (presetIdx + 1) % PRESETS.length;
    this.textContent = PRESETS[presetIdx].label;
    applyLight();
  };

  (function loop() {
    L.forEach((el, i) => {
      const o = Math.max(0, 1 - Math.abs(zd - i) * 1.45);
      el.firstElementChild.style.opacity = (o * castOp).toFixed(3);
    });
    requestAnimationFrame(loop);
  })();

  applyLight();
  setInterval(applyLight, 60000);
  addEventListener('hashchange', applyLight);
})();

draw();
</script>
</body>
</html>
